<div class="weather-stage" [class]="themeService.weather()">
  <!-- Sunny: Light rays -->
  <ng-container *ngIf="themeService.weather() === 'sunny'">
    <div class="sun-core"></div>
    <div *ngFor="let ray of rays; let i = index" class="light-ray" [style.--i]="i"></div>
    <div class="sun-haze"></div>
  </ng-container>

  <!-- Cloudy: Drifting clouds -->
  <ng-container *ngIf="themeService.weather() === 'cloudy'">
    <div *ngFor="let c of clouds; let i = index" class="cloud" [style.--i]="i" [style.--speed]="c.speed + 's'"
      [style.--size]="c.size" [style.--top]="c.top + '%'"></div>
  </ng-container>

  <!-- Rain: Droplets -->
  <ng-container *ngIf="themeService.weather() === 'rain'">
    <div *ngFor="let d of drops; let i = index" class="rain-drop" [style.--i]="i" [style.--x]="d.x + '%'"
      [style.--delay]="d.delay + 's'" [style.--speed]="d.speed + 's'"></div>
    <div class="rain-mist"></div>
  </ng-container>

  <!-- Breeze: Floating green and dried leaves -->
  <ng-container *ngIf="themeService.weather() === 'breeze'">
    <div *ngFor="let l of leaves; let i = index"
      class="leaf"
      [class.leaf-dried]="l.type === 'dried'"
      [style.--leaf-dur]="l.dur + 's'"
      [style.--leaf-delay]="l.delay + 's'"
      [style.--leaf-top]="l.top + '%'"
      [style.--leaf-scale]="l.size">
    </div>
  </ng-container>

  <!-- Snow: Snowflakes -->
  <ng-container *ngIf="themeService.weather() === 'snow'">
    <div *ngFor="let f of snowflakes; let i = index" class="snowflake" [style.left]="f.x + '%'"
      [style.--size]="f.size + 'px'" [style.--delay]="f.delay + 's'" [style.--speed]="f.speed + 's'"
      [style.--drift]="f.drift + 'px'"></div>
    <div class="snow-mist"></div>
  </ng-container>

  <!-- Stars for night theme -->
  <div class="stars-layer" *ngIf="isNight">
    <div *ngFor="let s of stars; let i = index" class="star" [style.left]="s.x + '%'" [style.top]="s.y + '%'"
      [style.--size]="s.size + 'px'" [style.--delay]="s.delay + 's'"></div>
  </div>

  <!-- Ambient gradient mesh -->
  <div class="ambient-mesh"></div>
</div>
